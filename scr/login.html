<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - La mismísima página</title>
    <link rel="stylesheet" href="estilos/login.css">
</head>
<body>
    <header>
        <h1>la mismisima pagina</h1>
    </header>
    <section class="sectionl" id="login">
        <div class="wrapper-login">
            <h2>INICIAR SESIÓN</h2>
            <div id="login-error" style="display:none;color:#e74c3c;font-size:.9em;margin-bottom:10px;text-align:center;background:#fdecea;padding:8px;border-radius:6px"></div>
            <div class="input-box">
                <input type="text" id="login-email" autocomplete="username" required placeholder=" ">
                <label>tu usuario</label>
            </div>
            <input type="hidden" id="login-username">
            <div class="input-box">
                <input type="password" id="login-password" autocomplete="current-password" required placeholder=" ">
                <label>tu contraseña</label>
            </div>
            <div class="remember">
                <label><input type="checkbox"> recordame</label>
                <a href="#">¿olvidaste tu contraseña?</a>
            </div>
            <button class="btn" id="btn-login" type="button">Iniciar sesión</button>
            <p>¿no tenés una cuenta? <a href="sign.html">creá una cuenta</a></p>
            <p style="margin-top:8px"><a href="index.html">volver al inicio</a></p>
        </div>
    </section>
</body>
</html>
